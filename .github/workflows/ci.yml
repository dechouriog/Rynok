name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint y typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  contracts:
    name: Contratos (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npx hardhat compile
        working-directory: contracts
      - run: npx hardhat test --coverage
        working-directory: contracts

  backend:
    name: Backend (unitarias + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm run test:cov:all -w backend
      - run: npm run build -w backend

  frontend:
    name: Frontend (pruebas + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:cov -w frontend
      - run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_CHAIN_ID: '11155111'
          NEXT_PUBLIC_ESCROW_ADDRESS: '0x049BBA8708b71E33f649Bae0E2F127F805ca9Ca9'

  browser-e2e:
    name: E2E de navegador (Playwright)
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rynok
          POSTGRES_PASSWORD: rynok
          POSTGRES_DB: rynok
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rynok"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
        working-directory: contracts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
